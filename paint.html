<!DOCTYPE html>
<html>

<head>
    <title>Mini Paint</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 20px;
            background: #f0f0f0;
            padding: 20px;
        }

        #toolbar {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: stretch;
            background: white;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
            width: 140px;
        }

        #toolbar button {
            width: 100%;
        }

        #colorPalette {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            justify-items: center;
        }

        .color-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid #999;
            cursor: pointer;
        }

        .color-btn.selected {
            border: 3px solid #333;
        }

        #shapeTools {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .tool-btn {
            width: 100%;
            aspect-ratio: 1;
            padding: 0;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tool-btn.selected {
            background: #dbeafe;
            border-color: #3b82f6;
        }

        #canvas {
            border: 1px solid #000;
            image-rendering: pixelated;
            cursor: none;
            background: white;
        }

        #canvasWrapper {
            position: relative;
            width: 600px;
            height: 600px;
        }

        #brushCursor {
            position: absolute;
            border: 1.5px solid #333;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(0, 0);
            display: none;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.8);
        }

        button {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #999;
            background: white;
            cursor: pointer;
        }

        button:hover {
            background: #eee;
        }

        label {
            font-size: 14px;
            display: block;
        }

        #brushSize {
            width: 100%;
        }
    </style>
</head>

<body>
    <div id="toolbar">
        <div id="colorPalette"></div>
        <div id="shapeTools">
            <button class="tool-btn selected" data-tool="brush" title="พู่กัน">✏️</button>
            <button class="tool-btn" data-tool="line" title="เส้นตรง">╱</button>
            <button class="tool-btn" data-tool="rect" title="สี่เหลี่ยม">▭</button>
            <button class="tool-btn" data-tool="ellipse" title="วงรี">◯</button>
            <button class="tool-btn" data-tool="triangle" title="สามเหลี่ยม">△</button>
            <button class="tool-btn" data-tool="fill" title="เทสี">🪣</button>
        </div>
        <label>ขนาดพู่กัน: <span id="sizeLabel">3</span>
            <input type="range" id="brushSize" min="1" max="15" value="3">
        </label>
        <button id="eraserBtn">ยางลบ</button>
        <button id="clearBtn">ล้างทั้งหมด</button>
        <button id="saveBtn">บันทึกรูป</button>
    </div>

    <div id="canvasWrapper">
        <canvas id="canvas" width="200" height="200" style="width:600px; height:600px;"></canvas>
        <div id="brushCursor"></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const imageData = ctx.createImageData(canvas.width, canvas.height);
        const data = imageData.data;

        // ---- ฟังก์ชันวาดพื้นฐาน (สไตล์เดียวกับต้นฉบับ) ----
        function putPixel(x, y, r, g, b, a = 255) {
            if (x < 0 || y < 0 || x >= canvas.width || y >= canvas.height) return;
            const index = (y * canvas.width + x) * 4;
            data[index] = r;
            data[index + 1] = g;
            data[index + 2] = b;
            data[index + 3] = a;
        }

        function drawLine(x1, y1, x2, y2, r, g, b, size, a = 255) {
            const dx = Math.abs(x2 - x1);
            const dy = Math.abs(y2 - y1);

            if (dx > dy) {
                const m = dx === 0 ? 0 : (y2 - y1) / (x2 - x1);
                const c = y1 - m * x1;
                for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
                    const y = Math.round(m * x + c);
                    drawBrush(x, y, r, g, b, size, a);
                }
            } else {
                const m = dy === 0 ? 0 : (x2 - x1) / (y2 - y1);
                const c = x1 - m * y1;
                for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
                    const x = Math.round(m * y + c);
                    drawBrush(x, y, r, g, b, size, a);
                }
            }
        }

        // พู่กันทรงกลม ขนาดปรับได้ (ใช้รัศมีแบบทศนิยมเพื่อให้ได้วงกลมจริง ไม่ใช่รูปกากบาท)
        function drawBrush(cx, cy, r, g, b, size, a = 255) {
            const radius = size / 2;
            const bound = Math.ceil(radius);
            const threshold = radius * radius + 0.5;
            for (let y = -bound; y <= bound; y++) {
                for (let x = -bound; x <= bound; x++) {
                    if (x * x + y * y <= threshold) {
                        putPixel(cx + x, cy + y, r, g, b, a);
                    }
                }
            }
        }

        function clearCanvas() {
            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    putPixel(x, y, 255, 255, 255);
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        // ---- ฟังก์ชันวาดรูปทรง (ใช้ drawLine/drawBrush เดิม) ----
        function drawRectShape(x1, y1, x2, y2, r, g, b, size) {
            drawLine(x1, y1, x2, y1, r, g, b, size);
            drawLine(x2, y1, x2, y2, r, g, b, size);
            drawLine(x2, y2, x1, y2, r, g, b, size);
            drawLine(x1, y2, x1, y1, r, g, b, size);
        }

        function drawEllipseShape(x1, y1, x2, y2, r, g, b, size) {
            const cx = (x1 + x2) / 2;
            const cy = (y1 + y2) / 2;
            const rx = Math.abs(x2 - x1) / 2;
            const ry = Math.abs(y2 - y1) / 2;
            const steps = 120;
            for (let i = 0; i < steps; i++) {
                const angle = (i / steps) * 2 * Math.PI;
                const px = Math.round(cx + rx * Math.cos(angle));
                const py = Math.round(cy + ry * Math.sin(angle));
                drawBrush(px, py, r, g, b, size);
            }
        }

        function drawTriangleShape(x1, y1, x2, y2, r, g, b, size) {
            const topX = Math.round((x1 + x2) / 2);
            drawLine(topX, y1, x1, y2, r, g, b, size);
            drawLine(x1, y2, x2, y2, r, g, b, size);
            drawLine(x2, y2, topX, y1, r, g, b, size);
        }

        // ---- เทสี (flood fill) ----
        function getPixel(x, y) {
            const i = (y * canvas.width + x) * 4;
            return [data[i], data[i + 1], data[i + 2], data[i + 3]];
        }

        function colorsMatch(c1, c2) {
            return c1[0] === c2[0] && c1[1] === c2[1] && c1[2] === c2[2] && c1[3] === c2[3];
        }

        function floodFill(startX, startY, r, g, b) {
            const target = getPixel(startX, startY);
            const fillColor = [r, g, b, 255];
            if (colorsMatch(target, fillColor)) return;

            const stack = [[startX, startY]];
            while (stack.length > 0) {
                const [x, y] = stack.pop();
                if (x < 0 || y < 0 || x >= canvas.width || y >= canvas.height) continue;
                if (!colorsMatch(getPixel(x, y), target)) continue;

                putPixel(x, y, r, g, b);
                stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
            }
            ctx.putImageData(imageData, 0, 0);
        }

        // ---- สถานะเครื่องมือ ----
        const colors = [
            [0, 0, 0],       // ดำ
            [255, 0, 0],     // แดง
            [255, 165, 0],   // ส้ม
            [255, 255, 0],   // เหลือง
            [0, 200, 0],     // เขียว
            [0, 120, 255],   // ฟ้า
            [128, 0, 200],   // ม่วง
            [150, 75, 0],    // น้ำตาล
        ];

        let currentColor = colors[0];
        let isEraser = false;
        let brushSize = 3;
        let isDragging = false;
        let prevX = 0;
        let prevY = 0;
        let currentTool = 'brush';
        let startX = 0;
        let startY = 0;
        let snapshot = null;

        // ---- สร้างปุ่มสี ----
        const palette = document.getElementById('colorPalette');
        colors.forEach((c, i) => {
            const btn = document.createElement('div');
            btn.className = 'color-btn' + (i === 0 ? ' selected' : '');
            btn.style.background = `rgb(${c[0]},${c[1]},${c[2]})`;
            btn.addEventListener('click', () => {
                currentColor = c;
                isEraser = false;
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
            });
            palette.appendChild(btn);
        });

        document.getElementById('eraserBtn').addEventListener('click', () => {
            isEraser = true;
        });

        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentTool = btn.dataset.tool;
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
            });
        });

        document.getElementById('clearBtn').addEventListener('click', clearCanvas);

        document.getElementById('brushSize').addEventListener('input', (e) => {
            brushSize = parseInt(e.target.value);
            document.getElementById('sizeLabel').textContent = brushSize;
            const rect = canvas.getBoundingClientRect();
            const displayScale = rect.width / canvas.width;
            const diameter = Math.max(brushSize * displayScale, 4);
            brushCursor.style.width = diameter + 'px';
            brushCursor.style.height = diameter + 'px';
        });

        document.getElementById('saveBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'my-painting.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // ---- แปลงตำแหน่งเมาส์ให้ตรงกับพิกเซลจริงของ canvas ----
        function toScaledMouseCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: Math.floor((clientX - rect.left) * scaleX),
                y: Math.floor((clientY - rect.top) * scaleY)
            };
        }

        // ---- เคอร์เซอร์วงกลมแทนเครื่องหมาย + ----
        const brushCursor = document.getElementById('brushCursor');

        function updateBrushCursor(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const displayScale = rect.width / canvas.width;
            const diameter = Math.max(brushSize * displayScale, 4);
            brushCursor.style.width = diameter + 'px';
            brushCursor.style.height = diameter + 'px';
            brushCursor.style.left = (clientX - rect.left - diameter / 2) + 'px';
            brushCursor.style.top = (clientY - rect.top - diameter / 2) + 'px';
        }

        canvas.addEventListener('mouseenter', (event) => {
            brushCursor.style.display = 'block';
            updateBrushCursor(event.clientX, event.clientY);
        });

        canvas.addEventListener('mouseleave', () => {
            brushCursor.style.display = 'none';
        });

        function getDrawColor() {
            return isEraser ? [255, 255, 255] : currentColor;
        }

        canvas.addEventListener('mousedown', function (event) {
            const { x, y } = toScaledMouseCoords(event.clientX, event.clientY);
            const [r, g, b] = getDrawColor();
            startX = x;
            startY = y;
            prevX = x;
            prevY = y;

            if (currentTool === 'fill') {
                floodFill(x, y, r, g, b);
                return;
            }

            isDragging = true;

            if (currentTool === 'brush') {
                drawBrush(x, y, r, g, b, brushSize);
                ctx.putImageData(imageData, 0, 0);
            } else {
                // เก็บภาพก่อนเริ่มวาด เพื่อใช้ preview รูปทรง
                snapshot = new Uint8ClampedArray(data);
            }
        });

        canvas.addEventListener('mousemove', function (event) {
            updateBrushCursor(event.clientX, event.clientY);
            if (!isDragging) return;
            const { x, y } = toScaledMouseCoords(event.clientX, event.clientY);
            const [r, g, b] = getDrawColor();

            if (currentTool === 'brush') {
                drawLine(prevX, prevY, x, y, r, g, b, brushSize);
                ctx.putImageData(imageData, 0, 0);
                prevX = x;
                prevY = y;
            } else {
                // คืนภาพเดิมแล้ววาด preview รูปทรงใหม่ทับ
                data.set(snapshot);
                if (currentTool === 'line') {
                    drawLine(startX, startY, x, y, r, g, b, brushSize);
                } else if (currentTool === 'rect') {
                    drawRectShape(startX, startY, x, y, r, g, b, brushSize);
                } else if (currentTool === 'ellipse') {
                    drawEllipseShape(startX, startY, x, y, r, g, b, brushSize);
                } else if (currentTool === 'triangle') {
                    drawTriangleShape(startX, startY, x, y, r, g, b, brushSize);
                }
                ctx.putImageData(imageData, 0, 0);
            }
        });

        window.addEventListener('mouseup', function () {
            isDragging = false;
            snapshot = null;
        });

        // ---- เริ่มต้น: พื้นหลังขาว ----
        clearCanvas();
    </script>
</body>

</html>
